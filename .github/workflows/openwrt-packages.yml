name: OpenWrt packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      circu_repository:
        description: circu.js repository to build
        required: true
        default: imzlh/circu.js
        type: string
      circu_ref:
        description: circu.js branch, tag, or commit
        required: true
        default: master
        type: string

concurrency:
  group: openwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select package architectures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all: ${{ steps.matrices.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - id: matrices
        name: Expand architecture matrices
        shell: bash
        run: |
          set -euo pipefail
          ipk=$(sh scripts/openwrt-matrix.sh ipk)
          apk=$(sh scripts/openwrt-matrix.sh apk)
          all=$(jq -cn --argjson ipk "$ipk" --argjson apk "$apk" '$ipk + $apk')
          echo "all=$all" >> "$GITHUB_OUTPUT"

  daemon:
    name: ${{ matrix.channel == 'ipk' && 'IPK' || 'APK' }} ${{ matrix.arch }} (${{ matrix.target }}/${{ matrix.subtarget }})
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.select.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.circu_repository || 'imzlh/circu.js' }}
          ref: ${{ inputs.circu_ref || 'master' }}
          path: .ci/circu.js
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: nodejs/llhttp
          ref: release/v9.3.0
          path: .ci/llhttp
          fetch-depth: 1
      - name: Verify circu.js ABI
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/circu.js/src/message_clone.c
          test -f .ci/circu.js/src/message_clone.h
          grep -Fq 'TJS_EvBusEmit' .ci/circu.js/src/tjs.h
          grep -Fq 'src/message_clone.c' .ci/circu.js/CMakeLists.txt
      - name: Install SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl flex g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev pkg-config python3 rsync \
            swig unzip zlib1g-dev zstd
      - name: Build daemon package
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          set +e
          log="$RUNNER_TEMP/circud-$CHANNEL-$ARCH.log"
          sh scripts/build-openwrt.sh "$CHANNEL" "$ARCH" "$TARGET" \
            "$SUBTARGET" "dist/openwrt/$CHANNEL/$ARCH" 2>&1 |
            tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            annotation=$(tail -c 2800 "$log")
            annotation=${annotation//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            printf '::error title=%s %s failed::%s\n' \
              "$CHANNEL" "$ARCH" "$annotation"
            exit "$status"
          fi
      - name: Validate IPK payload
        if: matrix.channel == 'ipk'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ matrix.channel }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          set -euo pipefail
          package="dist/openwrt/$CHANNEL/$ARCH/circud-openwrt-${CHANNEL}-${ARCH}-${TARGET}-${SUBTARGET}.ipk"
          test -s "$package"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT HUP INT TERM
          if gzip -t "$package" 2>/dev/null; then
            gzip -dc "$package" > "$work/outer.tar"
            tar -xf "$work/outer.tar" -C "$work"
          elif tar -tf "$package" >/dev/null 2>&1; then
            tar -xf "$package" -C "$work"
          elif ar t "$package" >/dev/null 2>&1; then
            (cd "$work" && ar x "$package")
          else
            echo 'IPK has no supported archive format' >&2
            exit 1
          fi
          data_archive=$(find "$work" -maxdepth 1 -type f \
            \( -name 'data.tar' -o -name 'data.tar.gz' -o -name 'data.tar.zst' \
               -o -name 'data.tar.xz' -o -name 'data.tar.bz2' \) \
            -print | head -n 1)
          test -n "$data_archive"
          case "$data_archive" in
            *.tar.zst) tar --zstd -xOf "$data_archive" > "$work/data.tar" ;;
            *)
              if gzip -t "$data_archive" 2>/dev/null; then
                gzip -dc "$data_archive" > "$work/data.tar"
              else
                cp "$data_archive" "$work/data.tar"
              fi
              ;;
          esac
          payload=$(tar -tf "$work/data.tar")
          grep -Fxq './usr/bin/circud' <<<"$payload"
          grep -Fxq './etc/init.d/circud' <<<"$payload"
          grep -Fxq './etc/circud/config.json' <<<"$payload"
          grep -Fxq './usr/share/circud/circud.example.json' <<<"$payload"
          grep -Fxq './usr/share/circud/public/index.html' <<<"$payload"
      - uses: actions/upload-artifact@v4
        with:
          name: circud-openwrt-${{ matrix.channel }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.subtarget }}
          path: |
            dist/openwrt/${{ matrix.channel }}/${{ matrix.arch }}/*.${{ matrix.channel }}
            dist/openwrt/${{ matrix.channel }}/${{ matrix.arch }}/*.buildinfo
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: circud-openwrt-${{ matrix.channel }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.subtarget }}-logs
          path: ${{ runner.temp }}/circud-${{ matrix.channel }}-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7

  luci:
    name: LuCI ${{ matrix.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: ipk
            arch: x86_64
            target: x86
            subtarget: 64
          - channel: apk
            arch: x86_64
            target: x86
            subtarget: 64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.circu_repository || 'imzlh/circu.js' }}
          ref: ${{ inputs.circu_ref || 'master' }}
          path: .ci/circu.js
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: nodejs/llhttp
          ref: release/v9.3.0
          path: .ci/llhttp
          fetch-depth: 1
      - name: Verify circu.js ABI
        shell: bash
        run: |
          set -euo pipefail
          test -f .ci/circu.js/src/message_clone.c
          test -f .ci/circu.js/src/message_clone.h
          grep -Fq 'TJS_EvBusEmit' .ci/circu.js/src/tjs.h
          grep -Fq 'src/message_clone.c' .ci/circu.js/CMakeLists.txt
      - name: Test LuCI configuration model
        shell: bash
        run: |
          set -euo pipefail
          node --check \
            packaging/openwrt/luci-app-circud/htdocs/luci-static/resources/view/circud/overview.js
          node tests/luci_overview_test.js
          bash -n tests/run_luci_target_tests.sh
          jq empty \
            packaging/openwrt/luci-app-circud/root/usr/share/luci/menu.d/luci-app-circud.json \
            packaging/openwrt/luci-app-circud/root/usr/share/rpcd/acl.d/luci-app-circud.json
      - name: Install SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl flex g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev pkg-config python3 rsync \
            swig unzip zlib1g-dev zstd
      - name: Build LuCI package
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          set +e
          log="$RUNNER_TEMP/circud-luci-$CHANNEL.log"
          sh scripts/build-luci-openwrt.sh "$CHANNEL" "$ARCH" "$TARGET" \
            "$SUBTARGET" "dist/openwrt/luci/$CHANNEL" 2>&1 |
            tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            annotation=$(tail -c 2800 "$log")
            annotation=${annotation//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            printf '::error title=LuCI %s failed::%s\n' \
              "$CHANNEL" "$annotation"
            exit "$status"
          fi
      - name: Validate LuCI IPK payload
        if: matrix.channel == 'ipk'
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          package="dist/openwrt/luci/$CHANNEL/circud-luci-${CHANNEL}.ipk"
          test -s "$package"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT HUP INT TERM
          if gzip -t "$package" 2>/dev/null; then
            gzip -dc "$package" > "$work/outer.tar"
            tar -xf "$work/outer.tar" -C "$work"
          else
            tar -xf "$package" -C "$work"
          fi
          data_archive=$(find "$work" -maxdepth 1 -type f \
            \( -name 'data.tar' -o -name 'data.tar.gz' -o -name 'data.tar.zst' \
               -o -name 'data.tar.xz' -o -name 'data.tar.bz2' \) \
            -print | head -n 1)
          test -n "$data_archive"
          case "$data_archive" in
            *.tar.zst) tar --zstd -xOf "$data_archive" > "$work/data.tar" ;;
            *)
              if gzip -t "$data_archive" 2>/dev/null; then
                gzip -dc "$data_archive" > "$work/data.tar"
              else
                cp "$data_archive" "$work/data.tar"
              fi
              ;;
          esac
          payload=$(tar -tf "$work/data.tar")
          grep -Fxq './www/luci-static/resources/view/circud/overview.js' <<<"$payload"
          grep -Fxq './usr/share/luci/menu.d/luci-app-circud.json' <<<"$payload"
          grep -Fxq './usr/share/rpcd/acl.d/luci-app-circud.json' <<<"$payload"
          grep -Fxq './usr/share/rpcd/ucode/luci.circud' <<<"$payload"
          grep -Fxq './usr/share/ucode/luci/controller/circud.uc' <<<"$payload"
      - uses: actions/upload-artifact@v4
        with:
          name: circud-openwrt-luci-${{ matrix.channel }}
          path: |
            dist/openwrt/luci/${{ matrix.channel }}/*.${{ matrix.channel }}
            dist/openwrt/luci/${{ matrix.channel }}/*.buildinfo
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [daemon, luci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: circud-openwrt-*-*
          path: release-assets
      - name: Assemble release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find release-assets -type f \( -name '*.ipk' -o -name '*.apk' \) \
            -print0 | sort -z | while IFS= read -r -d '' source; do
              name=${source##*/}
              destination="release/$name"
              if [ -e "$destination" ]; then
                cmp -s "$source" "$destination" || {
                  printf 'duplicate release asset name: %s\n' "$name" >&2
                  exit 1
                }
              else
                cp "$source" "$destination"
              fi
            done
          test "$(find release -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)" -eq 40
          (cd release && sha256sum *.ipk *.apk > SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes --title "circud $GITHUB_REF_NAME"
          fi
